<!doctype html>
<html lang="zh-CN" data-backend="hub">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#121615">
<title>观 · 摄像头控制台</title>
<style>
:root{--bg:#121615;--panel:#191e1c;--line:#303833;--muted:#929e96;--text:#edf1ec;--accent:#b9dca4;--warn:#e1ba85}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,select,input{font:inherit}button,a,select{touch-action:manipulation}button,select{background:#232b25;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:9px 13px;cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}a{color:var(--accent)}.shell{max-width:1720px;margin:auto;padding:0 36px}.header{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:14px}.mark{font-family:serif;font-size:32px;line-height:1;color:var(--accent)}.brand strong{font-size:16px;font-weight:550;letter-spacing:.07em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.15em;margin-top:3px}.header-right{display:flex;align-items:center;gap:20px;color:var(--muted);font-size:12px}.lamp{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:7px}.lamp.online{background:var(--accent);box-shadow:0 0 0 4px #b9dca410}.workspace{display:grid;grid-template-columns:176px minmax(0,1fr) 290px;gap:28px;padding:30px 0 22px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin:0 0 18px}.devices{padding-top:5px}.device{display:block;width:100%;text-align:left;border:0;border-radius:0;border-left:2px solid transparent;background:none;padding:14px 10px 14px 14px;margin:0 0 8px;transition:background .18s,border-color .18s}.device[aria-pressed="true"]{border-left-color:var(--accent);background:#b9dca409}.device strong{font-size:13px;font-weight:500;display:block}.device small{color:var(--muted);font-size:11px;display:block;margin:5px 0 0}.device .device-state{font-size:10px;color:var(--muted)}.side-note{margin:30px 12px 0;color:var(--muted);font-size:11px;line-height:1.9}.title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}h1{font-size:24px;font-weight:500;letter-spacing:-.04em;margin:0}h2{font-size:14px;font-weight:500;margin:0}.subtitle{margin:4px 0 0;font-size:11px;color:var(--muted)}.live-tag{font-size:10px;letter-spacing:.13em;color:var(--accent);border:1px solid #b9dca430;padding:4px 9px;border-radius:4px}.viewport{aspect-ratio:4/3;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#080b09;border:1px solid #242c26;border-radius:10px}.viewport img{width:100%;height:100%;object-fit:contain;display:block}.viewport:fullscreen{border:0;border-radius:0;aspect-ratio:auto}.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;gap:12px;color:var(--muted)}.empty svg{width:38px;height:38px;opacity:.5}.empty strong{font-size:14px;color:#c3ccc4;font-weight:450}.empty small{max-width:300px;font-size:11px}.hidden{display:none!important}.image-caption{position:absolute;bottom:14px;left:16px;display:flex;gap:10px;font-size:10px;color:#f1f5ef;background:#080b09ba;border:1px solid #ffffff12;border-radius:4px;padding:5px 9px}.view-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.view-actions>div{display:flex;gap:7px;align-items:center}.primary{color:var(--accent);border-color:#b9dca442;background:#b9dca40c}.icon-button{padding:9px 11px}.telemetry{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 0}.telemetry dt{color:var(--muted);font-size:10px;margin-bottom:5px}.telemetry dd{margin:0;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}.telemetry dd small{color:var(--muted);font-size:10px;margin-left:3px}.inspector{border-left:1px solid var(--line);padding-left:25px;padding-top:5px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}.status-text{font-size:10px;color:var(--accent)}.status-text.warn{color:var(--warn)}.snapshot{aspect-ratio:4/3;background:#0d110e;border:1px solid #283129;border-radius:7px;position:relative;overflow:hidden;margin-bottom:13px}.snapshot img{width:100%;height:100%;object-fit:contain}.snapshot .empty{font-size:11px;gap:7px}.event-caption{font-size:11px;color:var(--muted);margin-bottom:25px}.event-caption strong{color:var(--text);font-size:12px;font-weight:450;display:block;margin-bottom:3px}.fact{display:flex;justify-content:space-between;font-size:11px;padding:10px 0;border-bottom:1px solid #30383388}.fact span{color:var(--muted)}.fact strong{font-weight:450;font-variant-numeric:tabular-nums}.inspector section+section{margin-top:30px}.event-list{list-style:none;margin:0;padding:0}.event-list li{padding:11px 0;border-bottom:1px solid #30383388;display:flex;justify-content:space-between;gap:12px;font-size:11px}.event-list time{color:var(--muted)}.quiet{font-size:11px;color:var(--muted);line-height:1.8}.footer{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);padding:18px 0 24px;font-size:10px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:12px 20px;max-width:90vw;background:#263027;border:1px solid #56684e;border-radius:8px;z-index:5;font-size:12px;box-shadow:0 8px 32px #0005}.workspace{animation:arrive .4s ease both}.snapshot img,.viewport img{animation:arrive .2s ease both}@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(min-width:1500px){.workspace{grid-template-columns:190px minmax(0,1fr) 310px;gap:34px}}@media(max-width:1150px){.workspace{grid-template-columns:142px minmax(0,1fr);gap:22px}.inspector{grid-column:2;border-left:0;padding-left:0;display:grid;grid-template-columns:1fr 1fr;gap:26px;border-top:1px solid var(--line);padding-top:24px}.inspector section+section{margin:0}.inspector .history{grid-column:1/-1}.shell{padding:0 24px}}@media(max-width:650px){.shell{padding:0 16px}.header{height:74px}.header-right #clock{display:none}.brand strong{font-size:14px}.workspace{display:block;padding-top:18px}.devices{display:flex;gap:8px;padding:0;margin-bottom:23px}.devices>.eyebrow,.side-note{display:none}.devices #devices{display:flex;gap:8px;width:100%}.device{margin:0;flex:1;border-left:0;border-bottom:2px solid transparent;padding:10px 12px}.device[aria-pressed="true"]{border-left-color:transparent;border-bottom-color:var(--accent)}.device small{font-size:10px}.device .device-state{display:none}h1{font-size:21px}.viewport{border-radius:7px}.view-actions{gap:6px}.view-actions>div{gap:5px}button,select{padding:9px 10px;font-size:12px}.telemetry{gap:8px}.telemetry dd{font-size:14px}.inspector{display:block;margin-top:6px}.inspector section+section{margin-top:26px}.snapshot{max-width:100%}.footer{margin-top:24px}.footer span:last-child{display:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
 <header class="header"><div class="brand"><span class="mark" aria-hidden="true">观</span><div><strong>家庭影像控制台</strong><small>HOME OBSERVATORY</small></div></div><div class="header-right"><span id="clock"></span><span><i id="connectionLamp" class="lamp"></i><span id="connection">正在连接</span></span></div></header>
 <div class="workspace">
  <nav class="devices" aria-label="摄像头"><p class="eyebrow">设备 / DEVICES</p><div id="devices"></div><p class="side-note" id="roleNote">画面与检测独立运行。<br>选择设备查看状态。</p></nav>
  <main>
   <div class="title-row"><div><h1 id="viewTitle">实时画面</h1><p class="subtitle" id="viewSubtitle">等待设备状态</p></div><span class="live-tag" id="liveTag">连接中</span></div>
   <div class="viewport" id="viewport"><img id="liveImage" alt="摄像头实时画面" class="hidden"><div class="empty" id="viewEmpty"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="5" y="10" width="23" height="21" rx="4"/><path d="m28 17 8-4v15l-8-4M13 6h7"/></svg><strong id="viewMessage">正在连接摄像头</strong><small id="viewHint">设备画面会在连接后显示</small></div><div class="image-caption hidden" id="imageCaption"><span id="imageName">CAM 01</span><span id="imageTime"></span></div></div>
   <div class="view-actions"><div><button id="pauseButton" class="primary" type="button">暂停画面</button><button id="captureButton" type="button">保存照片</button></div><div><label for="resolution" class="hidden">画面分辨率</label><select id="resolution" aria-label="画面分辨率"><option value="qvga">320 × 240</option><option value="cif" selected>400 × 296</option><option value="hvga">480 × 320</option><option value="vga">640 × 480</option><option value="svga">800 × 600</option></select><button class="icon-button" id="fullscreenButton" aria-label="全屏查看" title="全屏查看" type="button">⛶</button></div></div>
   <dl class="telemetry"><div><dt>画面更新</dt><dd id="fps">—<small>fps</small></dd></div><div><dt>处理耗时</dt><dd id="cost">—<small>ms</small></dd></div><div><dt>当前画质</dt><dd id="quality">—</dd></div><div><dt>设备角色</dt><dd id="role">—</dd></div></dl>
  </main>
  <aside class="inspector" aria-label="移动检测与抓拍">
   <section><div class="section-head"><h2>最近抓拍</h2><span id="motionStatus" class="status-text">等待检测机</span></div><div class="snapshot"><img id="eventImage" alt="最近一次移动检测抓拍" class="hidden"><div class="empty" id="eventEmpty"><span>暂无抓拍</span><small>检测到移动后显示照片</small></div></div><div class="event-caption"><strong id="eventTitle">等待移动事件</strong><span id="eventTime">照片将保存在控制台</span></div><div class="fact"><span>检测事件</span><strong id="eventCount">—</strong></div><div class="fact"><span>推送成功 / 失败</span><strong id="pushCount">— / —</strong></div><div class="fact"><span>最近变化比例</span><strong id="motionScore">—</strong></div><div class="fact"><span>检测设备</span><strong id="detectorName">未连接</strong></div></section>
   <section class="history"><div class="section-head"><h2>事件记录</h2><span class="quiet" id="historyCount">最近 0 条</span></div><ul id="eventList" class="event-list"></ul><p id="historyEmpty" class="quiet">暂无事件。检测触发后的抓拍会出现在这里。</p></section>
  </aside>
 </div>
 <footer class="footer"><span id="footerStatus">等待设备连接</span><span>观 · HOME OBSERVATORY</span></footer>
</div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id), hub = document.documentElement.dataset.backend === 'hub';
 const roleLabel = role => ({stream:'实时推流',detector:'移动检测',hybrid:'推流 + 检测'}[role] || '未知');
 let cameras = [], selected = '', detector = null, paused = false, busy = false, stateBusy = false;
 let generation = 0, sequence = 0, liveUrl = '', eventUrl = '', eventKey = '', lastLiveBlob = null, lastFrameAt = 0, measuredFps = 0, eventBusy = false, toastTimer, previewFps = 5;
 const request = async (url, options = {}) => {
  const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 8000);
  try { return await fetch(url, {...options, cache:'no-store', credentials:'same-origin', signal:controller.signal}); }
  finally { clearTimeout(timer); }
 };
 const endpoint = (id, part) => hub ? '/api/cameras/' + encodeURIComponent(id) + '/' + part : ({snap:'/snap',settings:'/set',motion:'/motion',photo:'/motion/photo'}[part]);
 const current = () => cameras.find(c => c.id === selected);
 const text = (id, value) => { $(id).textContent = value; };
 const toast = message => { text('toast', message); $('toast').classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.add('hidden'), 4000); };
 const showViewMessage = (message, hint) => { text('viewMessage', message); text('viewHint', hint || ''); $('viewEmpty').classList.remove('hidden'); };
 function clearFrame() {
  if (liveUrl) URL.revokeObjectURL(liveUrl);
  liveUrl = ''; lastLiveBlob = null; sequence = 0; lastFrameAt = 0; measuredFps = 0;
  $('liveImage').removeAttribute('src'); $('liveImage').classList.add('hidden'); $('imageCaption').classList.add('hidden');
 }
 function selectCamera(id) {
  if (selected === id) return;
  selected = id; generation++; clearFrame();
  showViewMessage('正在切换设备', '连接后自动显示画面'); render();
 }
 function render() {
  const nav = $('devices'); nav.replaceChildren();
  cameras.forEach((camera, i) => {
   const button = document.createElement('button'); button.className = 'device'; button.type = 'button'; button.setAttribute('aria-pressed', String(camera.id === selected));
   const title = document.createElement('strong'); title.textContent = camera.name;
   const subtitle = document.createElement('small'); subtitle.textContent = '0' + (i+1) + ' / ' + roleLabel(camera.settings?.role || camera.role);
   const status = document.createElement('small'); status.className = 'device-state'; status.textContent = !camera.configured ? '待配置' : camera.online ? '已连接' : '连接中断';
   button.append(title, subtitle, status); button.onclick = () => selectCamera(camera.id); nav.append(button);
  });
  const camera = current(), settings = camera?.settings, isDetector = (settings?.role || camera?.role) === 'detector';
  text('viewTitle', camera?.name || '实时画面'); text('viewSubtitle', camera ? roleLabel(settings?.role || camera.role) + ' · ' + (camera.warning || (camera.online ? '已连接' : camera.configured ? '连接中断' : '待配置')) : '等待设备状态');
  text('role', settings ? roleLabel(settings.role) : '—');
  text('fps', camera?.online && !isDetector && !paused && measuredFps ? measuredFps.toFixed(1) : '—');
  text('cost', settings?.compress_ms ?? '—'); text('quality', settings?.quality ?? '—');
  if (settings?.size && document.activeElement !== $('resolution')) {
   const sizeMap = {'320x240':'qvga','400x296':'cif','480x320':'hvga','640x480':'vga','800x600':'svga'};
   if (sizeMap[settings.size]) $('resolution').value = sizeMap[settings.size];
  }
  $('resolution').disabled = !camera?.online;
  $('pauseButton').disabled = !camera?.configured || isDetector;
  $('captureButton').disabled = !lastLiveBlob;
  text('pauseButton', paused ? '继续画面' : '暂停画面');
  text('liveTag', isDetector ? '事件画面' : paused ? '已暂停' : camera?.online ? 'LIVE' : '未连接');
  if (isDetector) showViewMessage('检测设备正在独立工作', '最近的移动抓拍显示在右侧；选择推流设备查看实时画面');
  else if (!camera?.configured) showViewMessage('尚未配置摄像头', hub ? '在控制台配置文件中填写两台设备的地址' : '等待设备初始化');
  else if (!camera.online) showViewMessage('设备暂时离线', camera.error || '正在自动重连');
  else if (paused) showViewMessage('画面已暂停', '检测和推送继续运行');
  const online = cameras.filter(c => c.online).length;
  text('connection', online + ' / ' + cameras.length + ' 台在线'); $('connectionLamp').classList.toggle('online', online > 0);
  const motion = detector?.motion;
  text('motionStatus', !detector ? '未配置检测机' : !detector.online ? '检测机离线' : motion?.enabled ? '检测运行中' : '检测已关闭');
  $('motionStatus').classList.toggle('warn', !detector?.online || !motion?.enabled);
  text('detectorName', detector?.name || '未连接'); text('eventCount', motion?.events ?? '—');
  text('pushCount', motion ? motion.sent + ' / ' + motion.failed : '— / —'); text('motionScore', motion ? motion.last_score + '%' : '—');
  text('footerStatus', hub ? '双机控制台 · 节能预览 ' + previewFps + ' fps 上限' : '板载控制台 · ' + roleLabel(settings?.role));
 }
 async function updateEventPhoto(key, url) {
  if (key === eventKey || eventBusy) return;
  eventBusy = true;
  try {
   const response = await request(url); if (!response.ok) throw new Error('照片暂时不可用');
   const blob = await response.blob();
   if (eventUrl) URL.revokeObjectURL(eventUrl);
   eventUrl = URL.createObjectURL(blob); $('eventImage').src = eventUrl;
   $('eventImage').classList.remove('hidden'); $('eventEmpty').classList.add('hidden'); eventKey = key;
  } catch (_) { text('eventTitle', '抓拍照片暂时无法读取'); }
  finally { eventBusy = false; }
 }
 function renderEvents(events) {
  const list = $('eventList'); list.replaceChildren();
  events.slice(0,5).forEach(event => {
   const li = document.createElement('li'), link = document.createElement('a'), time = document.createElement('time');
   link.textContent = '移动抓拍 · ' + event.score + '%'; link.href = '/api/events/' + encodeURIComponent(event.id) + '.jpg'; link.target = '_blank'; link.rel = 'noopener';
   const date = new Date(event.received_at); time.textContent = date.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); time.dateTime = event.received_at;
   li.append(link,time); list.append(li);
  });
  text('historyCount', '最近 ' + Math.min(events.length,5) + ' 条'); $('historyEmpty').classList.toggle('hidden', events.length > 0);
  if (events.length) {
   const event = events[0]; text('eventTitle', '检测到移动 · 变化 ' + event.score + '%');
   text('eventTime', new Date(event.received_at).toLocaleString('zh-CN'));
   updateEventPhoto('hub-' + event.id, '/api/events/' + encodeURIComponent(event.id) + '.jpg');
  } else if (detector?.motion?.photo_bytes) {
   text('eventTitle', '检测机最近抓拍'); text('eventTime', '触发于设备运行 ' + Math.floor(detector.motion.last_uptime_ms / 1000) + ' 秒时');
   updateEventPhoto(detector.id + '-' + detector.motion.events + '-' + detector.motion.last_uptime_ms, endpoint(detector.id,'photo'));
  }
 }
 async function pollState() {
  if (stateBusy || document.hidden) return; stateBusy = true;
  try {
   let events = [];
   if (hub) {
    const response = await request('/api/state'); if (!response.ok) throw new Error('控制台连接失败');
    const data = await response.json(); cameras = data.cameras; events = data.events;
    previewFps = Math.max(1, Math.min(15, Number(data.preview_fps) || 5));
   } else {
    const responses = await Promise.all([request('/set'), request('/motion')]);
    if (responses.some(r => !r.ok)) throw new Error('设备连接失败');
    const settings = await responses[0].json(), motion = await responses[1].json();
    cameras = [{id:'local',name:settings.role === 'detector' ? '检测摄像头' : '实时摄像头',role:settings.role,configured:true,online:true,settings,motion}];
   }
   detector = cameras.find(c => (c.settings?.role || c.role) === 'detector') || cameras.find(c => c.motion?.enabled);
   if (!cameras.some(c => c.id === selected)) selectCamera(cameras[0]?.id || '');
   render(); renderEvents(events);
   if (!hub) { text('historyEmpty', '板载页面保留最近一张照片；双机控制台可保存事件记录。'); text('eventTime', detector?.motion?.events ? '触发于设备运行 ' + Math.floor(detector.motion.last_uptime_ms/1000) + ' 秒时' : '等待首次检测'); }
  } catch (_) {
   cameras.forEach(c => { c.online = false; }); render(); text('connection','连接中断，正在重试');
  } finally { stateBusy = false; }
 }
 async function pollFrame() {
  const camera = current();
  if (busy || paused || document.hidden || !camera?.online || (camera.settings?.role || camera.role) === 'detector') { setTimeout(pollFrame,250); return; }
  busy = true; const token = generation, started = performance.now();
  try {
   const response = await request(endpoint(camera.id,'snap') + '?after=' + sequence);
   if (response.status === 204) return;
   if (!response.ok) throw new Error('画面连接中断');
   const blob = await response.blob(); if (token !== generation) return;
   const nextUrl = URL.createObjectURL(blob), image = new Image(); image.src = nextUrl;
   try { await image.decode(); } catch (error) { URL.revokeObjectURL(nextUrl); throw error; }
   if (token !== generation) { URL.revokeObjectURL(nextUrl); return; }
   if (liveUrl) URL.revokeObjectURL(liveUrl); liveUrl = nextUrl;
   sequence = Number(response.headers.get('X-Frame-Id')) || 0; lastLiveBlob = blob;
   const now = performance.now(); if (lastFrameAt) { const fps = 1000/(now-lastFrameAt); measuredFps = measuredFps ? measuredFps * .8 + fps * .2 : fps; } lastFrameAt = now; text("fps", measuredFps ? measuredFps.toFixed(1) : "—");
   $('liveImage').src = liveUrl; $('liveImage').classList.remove('hidden'); $('imageCaption').classList.remove('hidden');
   if (!paused) $('viewEmpty').classList.add('hidden');
   text('imageName', camera.name); text('imageTime', new Date().toLocaleTimeString('zh-CN')); $('captureButton').disabled = false;
  } catch (_) { if (token === generation) showViewMessage('画面连接中断', '正在自动重连'); }
  finally {
   busy = false;
   const cameraPeriod = camera.settings?.fps_x10 > 0 ? Math.max(40,10000/camera.settings.fps_x10) : 120;
   const period = hub ? Math.max(1000 / previewFps, cameraPeriod) : cameraPeriod;
   setTimeout(pollFrame,Math.max(40,period-(performance.now()-started)));
  }
 }
 $('pauseButton').onclick = () => { paused = !paused; render(); if (!paused && liveUrl) $('viewEmpty').classList.add('hidden'); };
 $('captureButton').onclick = () => {
  if (!lastLiveBlob) return;
  const url = URL.createObjectURL(lastLiveBlob), link = document.createElement('a'); link.href=url; link.download='camera-' + Date.now() + '.jpg'; link.click(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast('照片已保存');
 };
 $('resolution').onchange = async () => {
  const camera = current(), value = $('resolution').value; if (!camera) return;
  $('resolution').disabled = true;
  try { const response = await request(endpoint(camera.id,'settings') + '?size=' + value); if (!response.ok) throw new Error(); generation++; clearFrame(); await pollState(); toast('分辨率已更新'); }
  catch (_) { toast('切换失败，请检查设备连接'); }
  finally { render(); }
 };
